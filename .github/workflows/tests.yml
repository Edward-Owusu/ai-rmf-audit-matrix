name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run the sample assessments
        run: |
          PYTHONPATH=src python -m ai_rmf samples/lakeview_bank --out reports
          PYTHONPATH=src python -m ai_rmf samples/northgate_logistics --out reports --fail-on high
